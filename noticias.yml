name: Atualizar manchetes
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  manchetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python atualizar_noticias.py
      - name: Salvar se mudou
        run: |
          git config user.name "robo-manchetes"
          git config user.email "robo-manchetes@users.noreply.github.com"
          git add noticias-auto.json
          git diff --cached --quiet || (git commit -m "Atualiza manchetes" && git pull --rebase && git push)

  #topo { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 1.6vmin 3vmin; background: var(--cor, #0e7c86); }
  #topo .marca { display: flex; align-items: center; gap: 2vmin; font-weight: 700; font-size: 3.2vmin; }
  #topo .marca img { height: 6vmin; max-width: 30vmin; object-fit: contain; }
  /* nome com o logo no lugar da letra M (ex.: "Be[logo] Fazer Card") */
  #nomeCanal { display: inline-flex; align-items: center; white-space: pre; }
  #nomeCanal img.logo-m { height: 1.15em; width: auto; margin: 0 .04em; transform: translateY(-.04em); }
  #relogio { text-align: right; line-height: 1.1; }
  #relogio .h { font-size: 4.2vmin; font-weight: 700; }
  #relogio .d { font-size: 2.1vmin; opacity: .9; }

  /* Área dos slides */
  #palco { flex: 1 1 auto; position: relative; overflow: hidden; }
  .slide { position: absolute; inset: 0; opacity: 0; display: flex; overflow: hidden; will-change: transform, opacity; }
  .slide.ativo { opacity: 1; z-index: 2; }
  .slide.saindo { opacity: 1; z-index: 1; }

  /* --- Entradas --- */
  .tr-fade.ativo     { animation: eFade 1s ease both; }
  .tr-deslizar.ativo { animation: eDesl 1s cubic-bezier(.22,.9,.25,1) both; }
  .tr-zoom.ativo     { animation: eZoom 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .tr-subir.ativo    { animation: eSubir 1s cubic-bezier(.22,.9,.25,1) both; }
  .tr-cortina.ativo  { animation: eCortina 1.1s cubic-bezier(.7,0,.3,1) both; }
  @keyframes eFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes eDesl    { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes eZoom    { from { opacity: 0; transform: scale(1.18); } to { opacity: 1; transform: none; } }
  @keyframes eSubir   { from { opacity: 0; transform: translateY(12%); } to { opacity: 1; transform: none; } }
  @keyframes eCortina { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
  /* --- Saídas --- */
  .sai-fade.saindo     { animation: sFade 1s ease both; }
  .sai-deslizar.saindo { animation: sDesl 1s cubic-bezier(.22,.9,.25,1) both; }
  .sai-zoom.saindo     { animation: sZoom 1.1s ease both; }
  .sai-subir.saindo    { animation: sSubir 1s ease both; }
  .sai-cortina.saindo  { animation: sFade 1.1s ease both; }
  @keyframes sFade  { to { opacity: 0; } }
  @keyframes sDesl  { to { transform: translateX(-35%); opacity: .2; } }
  @keyframes sZoom  { to { transform: scale(.9); opacity: 0; } }
  @keyframes sSubir { to { transform: translateY(-8%); opacity: 0; } }

  /* --- Textos entram em sequência --- */
  .slide.ativo .etiqueta, .slide.ativo .titulo, .slide.ativo .texto, .slide.ativo .chamada, .slide.ativo .numero,
  .slide.ativo .data, .slide.ativo .man, .slide.ativo .cc > * { animation: tSobe .8s cubic-bezier(.22,.9,.25,1) both; }
  .slide.ativo .etiqueta { animation-delay: .45s; }
  .slide.ativo .numero, .slide.ativo .data { animation-delay: .55s; }
  .slide.ativo .titulo   { animation-delay: .65s; }
  .slide.ativo .texto    { animation-delay: .85s; }
  .slide.ativo .chamada  { animation-delay: 1.05s; }
  .slide.ativo .man:nth-child(1) { animation-delay: .6s; } .slide.ativo .man:nth-child(2) { animation-delay: .75s; }
  .slide.ativo .man:nth-child(3) { animation-delay: .9s; }  .slide.ativo .man:nth-child(4) { animation-delay: 1.05s; }
  .slide.ativo .man:nth-child(5) { animation-delay: 1.2s; } .slide.ativo .man:nth-child(6) { animation-delay: 1.35s; }
  .slide.ativo .cc > :nth-child(1) { animation-delay: .5s; } .slide.ativo .cc > :nth-child(2) { animation-delay: .65s; }
  .slide.ativo .cc > :nth-child(3) { animation-delay: .8s; }  .slide.ativo .cc > :nth-child(4) { animation-delay: 1s; }
  @keyframes tSobe { from { opacity: 0; transform: translateY(4vmin); } to { opacity: 1; transform: none; } }

  /* --- Zoom lento nas imagens (efeito Ken Burns) --- */
  .slide.ativo.kb .m-img-anim { animation: kb var(--dur, 10s) linear both; }
  .slide.kb2.ativo .m-img-anim { animation-name: kb2; }
  @keyframes kb  { from { transform: scale(1);    } to { transform: scale(1.1) translate(-1.5%, -1%); } }
  @keyframes kb2 { from { transform: scale(1.1) translate(1.5%, 1%); } to { transform: scale(1); } }

  #direita { display: flex; align-items: center; gap: 3vmin; }
  #climaTopo { display: none; align-items: center; gap: 1vmin; font-size: 3.6vmin; font-weight: 700; padding-right: 3vmin; border-right: .3vmin solid rgba(255,255,255,.35); }
  #climaTopo .ic { font-size: 4.4vmin; }
  #climaTopo small { display: block; font-size: 1.8vmin; font-weight: 400; opacity: .85; }

  /* Rodapé (notícias) */
  #rodape { flex: 0 0 auto; display: flex; align-items: center; height: 7vmin; background: rgba(0,0,0,.55); overflow: hidden; }
  #rodape .rotulo { flex: 0 0 auto; height: 100%; display: flex; align-items: center; padding: 0 2.5vmin;
    background: var(--destaque, #f4b400); color: #111; font-weight: 800; font-size: 2.6vmin; text-transform: uppercase; }
  #rodape .faixa { flex: 1; overflow: hidden; white-space: nowrap; }
  #rodape .faixa span { display: inline-block; padding-left: 100%; font-size: 3vmin; animation: rolar linear infinite; }
  @keyframes rolar { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  /* ---------- Modelos ---------- */
  .m-aviso, .m-campanha, .m-noticia, .m-indicador, .m-relogio { flex-direction: column; justify-content: center; padding: 6vmin 7vmin; }
  .etiqueta { align-self: flex-start; background: var(--destaque, #f4b400); color: #111; font-weight: 800;
    padding: 1vmin 2.4vmin; border-radius: 1vmin; font-size: 2.6vmin; text-transform: uppercase; letter-spacing: .1vmin; margin-bottom: 3vmin; }
  .titulo { font-size: 7.5vmin; font-weight: 800; line-height: 1.08; margin-bottom: 3vmin; }
  .texto { font-size: 4.2vmin; line-height: 1.35; opacity: .95; white-space: pre-line; }

  .m-aviso { background: linear-gradient(160deg, var(--cor) 0%, var(--fundo) 85%); }

  .m-campanha { padding: 0; }
  .m-campanha .img { flex: 1 1 55%; background-size: cover; background-position: center; }
  .m-campanha .caixa { flex: 1 1 45%; padding: 5vmin 7vmin; display: flex; flex-direction: column; justify-content: center;
    background: var(--slidecor, var(--cor)); }
  .m-campanha .caixa .titulo { font-size: 6.5vmin; }
  .m-campanha .chamada { margin-top: 3vmin; align-self: flex-start; background: #fff; color: var(--slidecor, var(--cor));
    font-weight: 800; padding: 1.5vmin 3vmin; border-radius: 6vmin; font-size: 3.4vmin; }

  .m-noticia .img { width: 100%; height: 38vh; background-size: cover; background-position: center; border-radius: 2vmin; margin-bottom: 4vmin; }
  .m-noticia .data { font-size: 2.6vmin; opacity: .75; margin-bottom: 1.5vmin; }

  .m-indicador { align-items: center; text-align: center; background: radial-gradient(circle at 50% 40%, var(--cor) 0%, var(--fundo) 75%); }
  .m-indicador .numero { font-size: 26vmin; font-weight: 900; line-height: 1; color: var(--destaque); }
  .m-indicador .titulo { font-size: 6vmin; margin-top: 2vmin; }

  .m-relogio { align-items: center; text-align: center; }
  .m-relogio .grande { font-size: 24vmin; font-weight: 800; line-height: 1; }
  .m-relogio .dia { font-size: 5vmin; margin-top: 2vmin; opacity: .9; }

  .m-imagem, .m-video { background: #000; align-items: center; justify-content: center; }
  .m-imagem img, .m-video video { width: 100%; height: 100%; object-fit: var(--ajuste, contain); }

  /* Clima */
  .m-clima { flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 5vmin; background: #34495e; }
  .m-clima .cc { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; text-shadow: 0 .3vmin 1.2vmin rgba(0,0,0,.35); }
  .ceu { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  /* fundo fotográfico */
  .ceu .foto { position: absolute; inset: -4%; background-size: cover; background-position: center; animation: ceuMove 40s ease-in-out infinite alternate; }
  @keyframes ceuMove { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -2%); } }
  .ceu .veu { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.45) 100%); }
  /* chuva */
  .gota { position: absolute; top: -10%; width: .18vmin; height: 7vmin; background: linear-gradient(transparent, rgba(225,235,250,.55));
    animation: cai linear infinite; }
  @keyframes cai { to { transform: translateY(125vh) translateX(-6vmin); } }
  /* relâmpago */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: raio 7s infinite; }
  @keyframes raio { 0%, 88%, 92%, 100% { opacity: 0; } 89% { opacity: .55; } 90% { opacity: .1; } 91% { opacity: .4; } }
  .m-clima .dia { position: relative; overflow: hidden; background: #334 center / cover no-repeat; border: .25vmin solid rgba(255,255,255,.45);
    box-shadow: 0 1vmin 3vmin rgba(0,0,0,.35); min-width: 21vmin; padding: 2.2vmin 2.6vmin; }
  .m-clima .dia::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.38); }
  .m-clima .dia > * { position: relative; }
  .m-clima .dia .cond { font-size: 2.1vmin; opacity: .95; margin-top: .6vmin; }
  .m-clima .cidade { font-size: 4vmin; opacity: .9; margin-bottom: 1vmin; }
  .m-clima .agora { display: flex; align-items: center; gap: 4vmin; }
  .m-clima .agora .ic { font-size: 20vmin; line-height: 1; }
  .m-clima .agora .t { font-size: 18vmin; font-weight: 800; line-height: 1; }
  .m-clima .desc { font-size: 4.5vmin; margin: 1.5vmin 0 5vmin; }
  .m-clima .dias { display: flex; gap: 2.5vmin; flex-wrap: wrap; justify-content: center; }
  .m-clima .dia { border-radius: 2vmin; padding: 2.5vmin 3vmin; min-width: 18vmin; }
  .m-clima .dia b { display: block; font-size: 3vmin; text-transform: capitalize; }
  .m-clima .dia .ic { font-size: 7vmin; margin: 1vmin 0; }
  .m-clima .dia .mm { font-size: 3vmin; } .m-clima .dia .ch { font-size: 2.3vmin; opacity: .85; margin-top: .8vmin; }

  /* Manchetes */
  .m-manchetes { flex-direction: column; justify-content: center; padding: 5vmin 7vmin; }
  .m-manchetes .lista-m { display: flex; flex-direction: column; gap: 3vmin; }
  .m-manchetes .man { border-left: 1vmin solid var(--destaque); padding: 1vmin 0 1vmin 3vmin; }
  .m-manchetes .man .t { font-size: 4.4vmin; font-weight: 700; line-height: 1.2; }
  .m-manchetes .man .f { font-size: 2.4vmin; opacity: .75; margin-top: .8vmin; }
  body.vertical .m-manchetes .man .t { font-size: 4.8vmin; }

  /* Horizontal: campanha lado a lado */
  body.horizontal .m-campanha { flex-direction: row; }
  body.vertical .m-campanha { flex-direction: column; }
  body.horizontal .titulo { font-size: 6.5vmin; }
  body.horizontal .m-noticia { flex-direction: row; align-items: center; gap: 5vmin; }
  body.horizontal .m-noticia .img { width: 45%; height: 70%; margin: 0; flex: 0 0 auto; }

  /* ================= TEMA BEM FAZER CARD (igual ao site) ================= */
  body.tema-bf { --mag: #e8217f; --rox: #9b2bd6; --grad: linear-gradient(90deg, #e8217f 0%, #b22bd9 100%); }
  body.tema-bf #tela { font-family: "Montserrat", "Segoe UI", Arial, sans-serif; color: #fff; background-color: #130a24;
    background-image: radial-gradient(70vmax 55vmax at 88% 22%, rgba(118, 40, 205, .42), transparent 62%),
                      radial-gradient(55vmax 45vmax at 5% 95%, rgba(232, 33, 127, .18), transparent 60%),
                      linear-gradient(180deg, #160c2b 0%, #120a22 100%); }
  body.tema-bf #topo { background: rgba(12, 6, 24, .6); border-bottom: .15vmin solid rgba(255,255,255,.09); padding: 2vmin 3.5vmin; }
  body.tema-bf #relogio .h { font-weight: 800; }
  body.tema-bf #climaTopo { border-right-color: rgba(255,255,255,.15); }
  body.tema-bf .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* marca "be ♥ fazer card" */
  .wm { position: relative; display: inline-flex; align-items: center; line-height: 1; }
  .wm img.wm-img { height: 1.25em; width: auto; display: block; }
  .cor-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .wm-velho { font-family: "Poppins", "Montserrat", sans-serif; font-weight: 600;
    letter-spacing: -.02em; line-height: 1; color: #fff; padding-bottom: .42em; }
  .wm .wm-ic { display: inline-flex; width: 1.05em; height: .95em; margin: 0 .02em; transform: translateY(.06em); }
  .wm .wm-ic svg, .wm img.wm-ic { width: 100%; height: 100%; object-fit: contain; }
  .wm small { position: absolute; right: 0; bottom: 0; font-size: .42em; font-weight: 500; letter-spacing: 0; }
  .wm-topo { font-size: 5vmin; }
  body.tema-bf #topo .marca { font-size: inherit; }

  /* textos */
  body.tema-bf .slide { background: transparent !important; }
  body.tema-bf .m-aviso, body.tema-bf .m-campanha { padding: 0; }
  body.tema-bf .caixa { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: 7vmin 7vmin; background: none !important; }
  body.tema-bf .m-aviso .caixa, body.tema-bf .m-campanha:not(:has(.img)) .caixa { flex: 1 1 auto; }
  body.tema-bf .etiqueta { background: rgba(232,33,127,.06); color: #fff; border: .35vmin solid var(--mag); border-radius: 10vmin; text-transform: none;
    font-weight: 700; letter-spacing: 0; padding: 1.2vmin 3vmin; font-size: 2.8vmin; margin-bottom: 3.5vmin; }
  body.tema-bf .titulo { font-family: "Montserrat", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; line-height: .98; font-size: 9vmin; margin-bottom: 3.5vmin; }
  body.tema-bf.horizontal .titulo { font-size: 7.4vmin; }
  body.tema-bf .texto { font-weight: 500; color: rgba(232, 224, 250, .9); font-size: 3.9vmin; line-height: 1.42; }
  body.tema-bf .texto b { color: #fff; font-weight: 800; }
  body.tema-bf .chamada { display: inline-flex; align-items: center; gap: 2.4vmin; align-self: flex-start; margin-top: 4.5vmin; background: var(--grad); color: #fff;
    border-radius: 10vmin; padding: 1.6vmin 1.6vmin 1.6vmin 4vmin; font-weight: 800; font-size: 3.1vmin; text-transform: uppercase; letter-spacing: .02em;
    box-shadow: 0 1.2vmin 5vmin rgba(232, 33, 127, .45); }
  body.tema-bf .chamada i { font-style: normal; display: inline-flex; align-items: center; justify-content: center; width: 6vmin; height: 6vmin; border-radius: 50%;
    background: rgba(255,255,255,.2); font-size: 3.4vmin; }
  body.tema-bf .numero { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
  body.tema-bf .m-indicador { background: none; }
  body.tema-bf .man { border-left: none; position: relative; padding-left: 3.5vmin; }
  body.tema-bf .man::before { content: ""; position: absolute; left: 0; top: 1vmin; bottom: 1vmin; width: .8vmin; border-radius: 1vmin; background: var(--grad); }
  body.tema-bf .man .t { font-weight: 700; }
  body.tema-bf .m-relogio .grande { font-weight: 900; letter-spacing: -.03em; }
  body.tema-bf .m-relogio .dia { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
  body.tema-bf .relogio-marca { font-size: 10vmin; margin-bottom: 5vmin; }
  body.tema-bf .m-clima .dia { border-color: rgba(255,255,255,.25); }

  /* layout com arte: vertical = texto em cima, arte embaixo; horizontal = texto à esquerda, arte à direita */
  body.tema-bf.vertical .slide.com-arte { flex-direction: column; }
  body.tema-bf.vertical .slide.com-arte .caixa { flex: 0 0 auto; padding-top: 9vmin; }
  body.tema-bf.vertical .slide.com-arte .arte { flex: 1 1 auto; }
  body.tema-bf.horizontal .slide.com-arte { flex-direction: row; }
  body.tema-bf.horizontal .slide.com-arte .caixa { flex: 0 0 56%; }
  body.tema-bf.horizontal .slide.com-arte .arte { flex: 1 1 44%; }
  .arte { position: relative; min-height: 30vmin; }

  /* cartões flutuando */
  .cartao { position: absolute; width: 50vmin; height: 31vmin; border-radius: 3.2vmin; padding: 3vmin 3.4vmin; color: #2a2ab8;
    background: linear-gradient(135deg, #f1f3ff 0%, #c9d2ff 100%); box-shadow: 0 3vmin 7vmin rgba(0,0,0,.45); animation: flutua 7s ease-in-out infinite; }
  .cartao .wm-cartao { font-size: 6vmin; }
  .cartao .wm-cartao, .cartao .wm-cartao small { color: inherit; }
  .cartao .c-ic { position: absolute; right: 3vmin; top: 2.6vmin; width: 6vmin; height: 5.4vmin; }
  .cartao .c-ic svg { width: 100%; height: 100%; }
  .cartao .c-mat { position: absolute; left: 3.4vmin; bottom: 7.4vmin; font-size: 1.8vmin; font-weight: 700; letter-spacing: .1em; opacity: .75; }
  .cartao .c-nome { position: absolute; left: 3.4vmin; bottom: 3.2vmin; font-size: 3.4vmin; font-weight: 900; letter-spacing: .04em; }
  .cartao.c2 { color: #fff; background: linear-gradient(135deg, #4a3cf0 0%, #2b20b8 100%); animation-delay: -2.3s; }
  .cartao.c3 { background: linear-gradient(135deg, #e2f6ff 0%, #a9dcf6 100%); color: #2a3cb8; animation-delay: -4.6s; }
  body.vertical .cartao.c1 { left: 10%; top: 4%;  --r: -18deg; }
  body.vertical .cartao.c2 { left: 44%; top: 24%; --r: 14deg; }
  body.vertical .cartao.c3 { left: 18%; top: 50%; --r: -8deg; }
  body.horizontal .cartao { width: 40vmin; height: 25vmin; }
  body.horizontal .cartao .wm-cartao { font-size: 5vmin; }
  body.horizontal .cartao.c1 { left: 4%;  top: 10%; --r: -22deg; }
  body.horizontal .cartao.c2 { left: 40%; top: 26%; --r: 16deg; }
  body.horizontal .cartao.c3 { left: 12%; top: 52%; --r: -8deg; }
  @keyframes flutua { 0%, 100% { transform: rotate(var(--r, 0deg)) translateY(0); } 50% { transform: rotate(var(--r, 0deg)) translateY(-2vmin); } }
  .coracao-solto { position: absolute; left: 2%; top: 38%; width: 24vmin; height: 22vmin; filter: drop-shadow(0 0 5vmin rgba(232,33,127,.6)); animation: flutua 6s ease-in-out infinite; --r: 0deg; z-index: 3; }
  body.horizontal .coracao-solto { width: 19vmin; height: 17vmin; left: -4%; top: 40%; }
  .coracao-solto svg, .coracao-grande svg { width: 100%; height: 100%; }
  .selo { position: absolute; z-index: 4; background: rgba(40, 24, 80, .72); border: .15vmin solid rgba(255,255,255,.18); border-radius: 1.6vmin;
    padding: 1.6vmin 2.6vmin; font-size: 2.6vmin; font-weight: 600; text-align: center; line-height: 1.25; box-shadow: 0 2vmin 5vmin rgba(0,0,0,.35); }
  .selo b { font-weight: 900; }
  body.vertical .selo.s1 { right: 5%; top: 6%; max-width: 30vmin; }
  body.vertical .selo.s2 { right: 6%; bottom: 6%; max-width: 30vmin; }
  body.horizontal .selo.s1 { right: 3%; top: 4%; max-width: 26vmin; }
  body.horizontal .selo.s2 { left: 6%; bottom: 6%; max-width: 26vmin; }
  /* coração grande com halo */
  .arte.coracao { display: flex; align-items: center; justify-content: center; }
  .coracao-grande { position: relative; z-index: 2; width: 44vmin; height: 40vmin; filter: drop-shadow(0 0 7vmin rgba(232,33,127,.55)); animation: flutua 6s ease-in-out infinite; --r: 0deg; }
  .halo { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; background: radial-gradient(circle, rgba(155,43,214,.35) 0%, transparent 65%); animation: pulsa2 6s ease-in-out infinite; }
  @keyframes pulsa2 { 50% { transform: scale(1.12); opacity: .7; } }
  .slide.ativo .arte { animation: tSobe 1.1s .5s cubic-bezier(.22,.9,.25,1) both; }

  /* Mensagens do sistema */
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: #0b2540; color: #fff; font-size: 3.5vmin; padding: 8vmin; z-index: 10; line-height: 1.5; }
  #status { position: fixed; right: 1vmin; bottom: 8vmin; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: transparent; z-index: 5; }
  #status.offline { background: #e53935; }
</style>
</head>

<div id="tela">
  <div id="topo">
    <div class="marca"><img id="logo" alt="" style="display:none"><span id="nomeCanal"></span></div>
    <div id="direita"><div id="climaTopo"></div><div id="relogio"><div class="h" id="hora">--:--</div><div class="d" id="data"></div></div></div>
  </div>
  <div id="palco"></div>
  <div id="rodape" style="display:none"><div class="rotulo" id="rotuloRodape">Notícias</div><div class="faixa"><span id="faixa"></span></div></div>
</div>
<div id="msg"></div>
<div id="status" title="sem conexão (usando cópia salva)"></div>

<script>
/*
  PLAYER – TV Corporativa própria
  Parâmetros da URL:
    canal=ID_DO_CANAL        (obrigatório se houver mais de um canal)
    fonte=URL_DO_JSON        (padrão: programacao.json na mesma pasta)
    atualizar=MINUTOS        (padrão: 2)
    orientacao=vertical|horizontal  (força; sem isso, detecta pela proporção da tela)
    girar=90|270             (gira o conteúdo quando o monitor está em pé mas o sistema não foi girado)
  Ex.: player.html?canal=bemfazer-loja
*/
const P = new URLSearchParams(location.search);
const FONTE = P.get('fonte') || 'programacao.json';
const CANAL_ID = P.get('canal');
const MIN_ATUALIZA = Math.max(0.5, parseFloat(P.get('atualizar') || '2'));
const CHAVE_CACHE = 'tvcorp_cache_' + FONTE;
const DIAS = ['dom','seg','ter','qua','qui','sex','sab'];
const ORIENT_URL = (P.get('orientacao') || '').toLowerCase();   // vertical | horizontal | (vazio = automático)
const GIRAR = parseInt(P.get('girar') || '0', 10);               // 90 ou 270: gira a imagem se o monitor está em pé mas o Windows/Android mostra deitado

let prog = null, canal = null, fila = [], idx = -1, timer = null, assinaturaAtual = '';
let ultimoOnline = 0;                       // última vez que algo veio da internet
let clima = null, climaEm = 0;              // previsão do tempo (Open-Meteo)
let manchetes = [], manchetesEm = 0, giroManchete = 0;
const BASE = new URL(FONTE === 'previa' ? 'programacao.json' : FONTE, location.href);
const URL_MANCHETES = new URL('noticias-auto.json', BASE).href;
const temInternet = () => navigator.onLine !== false && Date.now() - ultimoOnline < 10 * 60000;
const climaValido = () => clima && temInternet() && Date.now() - climaEm < 3 * 3600000;
const manchetesValidas = () => manchetes.length > 0 && temInternet() && Date.now() - manchetesEm < 6 * 3600000;
const PRECISA_INTERNET = ['clima', 'manchetes'];
const $ = id => document.getElementById(id);
const palco = $('palco');

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mostrarMsg(t) { $('msg').innerHTML = t; $('msg').style.display = t ? 'flex' : 'none'; }

/* ---------- Relógio ---------- */
function tick() {
  const d = new Date();
  $('hora').textContent = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const dt = d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
  $('data').textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
  document.querySelectorAll('.relogio-vivo').forEach(el => el.textContent = $('hora').textContent);
  document.querySelectorAll('.data-viva').forEach(el => el.textContent = $('data').textContent);
}
setInterval(tick, 1000); tick();

/* ---------- Carregar programação ---------- */
async function carregar() {
  try {
    const r = await fetch(FONTE + (FONTE.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const dados = JSON.parse(txt);
    try { localStorage.setItem(CHAVE_CACHE, txt); } catch (e) { /* cache cheio: segue sem salvar */ }
    const daCopia = r.headers.get('x-tvcorp-offline') === '1';
    if (!daCopia) ultimoOnline = Date.now();
    $('status').classList.toggle('offline', daCopia);
    aplicar(dados);
    guardarMidias(dados);
  } catch (e) {
    $('status').classList.add('offline');
    if (!prog) {
      let salvo = null;
      try { salvo = localStorage.getItem(CHAVE_CACHE); } catch (_) {}
      if (salvo) aplicar(JSON.parse(salvo));
      else mostrarMsg('Sem conexão e sem programação salva.<br>Verifique a internet da TV box.<br><small>' + esc(e.message) + '</small>');
    }
  }
}

function aplicar(dados) {
  const assinatura = JSON.stringify(dados);
  if (assinatura === assinaturaAtual) { montarFila(false); return; }
  assinaturaAtual = assinatura;
  prog = dados;
  const canais = dados.canais || [];
  canal = canais.find(c => c.id === CANAL_ID) || (CANAL_ID ? null : canais[0]);
  if (!canal) {
    mostrarMsg('Canal "' + esc(CANAL_ID) + '" não encontrado.<br>Canais disponíveis: ' + canais.map(c => '<b>' + esc(c.id) + '</b>').join(', '));
    return;
  }
  mostrarMsg('');
  const raiz = document.documentElement.style;
  raiz.setProperty('--cor', canal.cor || '#0e7c86');
  raiz.setProperty('--fundo', canal.fundo || '#0b2540');
  raiz.setProperty('--destaque', canal.destaque || '#f4b400');
  aplicarOrientacao();
  document.body.classList.toggle('tema-bf', canal.tema === 'bemfazer');
  aplicarOrientacao();
  const nome = canal.mostrarNome === false ? '' : (canal.nome || '');
  const pos = canal.logoNoM && canal.logo ? nome.search(/m/i) : -1;
  if (canal.tema === 'bemfazer' && canal.mostrarNome !== false) {
    $('nomeCanal').innerHTML = marcaHTML('wm-topo'); $('logo').style.display = 'none';
  } else if (pos >= 0) {
    // logo substitui a primeira letra M do nome; o logo não se repete ao lado
    $('nomeCanal').innerHTML = esc(nome.slice(0, pos)) + `<img class="logo-m" src="${esc(canal.logo)}" alt="M">` + esc(nome.slice(pos + 1));
    $('logo').style.display = 'none';
  } else {
    $('nomeCanal').textContent = nome;
    if (canal.logo) { $('logo').src = canal.logo; $('logo').style.display = ''; } else $('logo').style.display = 'none';
  }
  $('topo').style.display = canal.cabecalho === false ? 'none' : '';
  montarFila(true);
  atualizarClima(); atualizarManchetes();
}

/* ---------- Orientação ---------- */
function aplicarOrientacao() {
  const girada = GIRAR === 90 || GIRAR === 270;
  // largura/altura "reais" do conteúdo depois do giro
  const w = girada ? innerHeight : innerWidth, h = girada ? innerWidth : innerHeight;
  let o = ORIENT_URL;
  if (o !== 'vertical' && o !== 'horizontal') {
    const pref = canal && canal.orientacao;
    o = (pref === 'vertical' || pref === 'horizontal') ? pref : (h > w ? 'vertical' : 'horizontal');
  }
  const bf = document.body.classList.contains('tema-bf');
  document.body.className = o + (girada ? ' girar' + GIRAR : '') + (bf ? ' tema-bf' : '');
}
addEventListener('resize', aplicarOrientacao);
aplicarOrientacao();

/* ---------- Agenda ---------- */
function noAr(s, agora) {
  if (s.ativo === false) return false;
  if (s.canais && s.canais.length && !s.canais.includes(canal.id)) return false;
  if (s.tipo === 'clima' && !climaValido()) return false;          // sem internet: pula e segue com as mídias salvas
  if (s.tipo === 'manchetes' && !manchetesValidas()) return false;
  const local = new Date(agora.getTime() - agora.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if (s.inicio && local < s.inicio) return false;
  if (s.fim && local > s.fim) return false;
  if (s.dias && s.dias.length && !s.dias.includes(DIAS[agora.getDay()])) return false;
  const hm = agora.toTimeString().slice(0,5);
  if (s.horaIni && s.horaFim) {
    if (s.horaIni <= s.horaFim) { if (hm < s.horaIni || hm > s.horaFim) return false; }
    else { if (hm < s.horaIni && hm > s.horaFim) return false; } // atravessa a meia-noite
  } else if (s.horaIni && hm < s.horaIni) return false;
  else if (s.horaFim && hm > s.horaFim) return false;
  return true;
}

function montarFila(reiniciar) {
  const agora = new Date();
  const base = (prog.slides || []).filter(s => noAr(s, agora));
  // prioridade: slide com "repetir" N aparece N vezes, distribuído na fila
  const nova = [];
  base.forEach(s => { const n = Math.max(1, Math.min(5, parseInt(s.repetir || 1))); for (let i = 0; i < n; i++) nova.push({s, ordem: (i + 0.5) / n + nova.length * 1e-6}); });
  nova.sort((a, b) => a.ordem - b.ordem);
  const ids = nova.map(x => x.s.id).join('|');
  const antigos = fila.map(x => x.id).join('|');
  fila = nova.map(x => x.s);
  montarRodape();
  if (!fila.length) { mostrarMsg('Nenhum conteúdo programado para este horário.'); palco.innerHTML = ''; clearTimeout(timer); timer = null; return; }
  mostrarMsg('');
  if (reiniciar || ids !== antigos || !timer) { idx = -1; proximo(); }
}

function montarRodape() {
  const itens = (prog.noticias || []).filter(n => (!n.canais || !n.canais.length || n.canais.includes(canal.id)) && n.ativo !== false && noAr({...n, canais: null}, new Date()))
    .map(n => n.texto).filter(Boolean);
  if (canal.manchetesRodape && manchetesValidas()) manchetes.slice(0, 8).forEach(m => itens.push(m.titulo + ' (' + m.fonte + ')'));
  if (canal.rodape !== true || !itens.length) { $('rodape').style.display = 'none'; return; }
  $('rodape').style.display = '';
  $('rotuloRodape').textContent = canal.rotuloRodape || 'Notícias';
  const txt = itens.join('     •     ');
  const span = $('faixa');
  if (span.dataset.t !== txt) {
    span.dataset.t = txt; span.textContent = txt;
    span.style.animationDuration = Math.max(15, txt.length * 0.18) + 's';
  }
}

/* ---------- Transições ---------- */
const TRANSICOES = ['deslizar', 'zoom', 'subir', 'cortina', 'fade'];
let ultimaTr = '';
function escolherTransicao(s) {
  const t = s.transicao || canal.transicao || 'aleatoria';
  if (t !== 'aleatoria' && TRANSICOES.includes(t)) return t;
  const ops = TRANSICOES.filter(x => x !== ultimaTr);      // não repete a mesma duas vezes seguidas
  return ultimaTr = ops[Math.floor(Math.random() * ops.length)];
}

/* ---------- Renderização ---------- */
function bg(url) { return url ? `style="background-image:url('${esc(url)}')"` : ''; }

// *palavra* = destaque em degradê • **palavra** = negrito • quebra de linha preservada
function fmt(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<span class="grad">$1</span>');
}
function temaBF() { return document.body.classList.contains('tema-bf'); }

function render(s) {
  const el = document.createElement('div');
  el.className = 'slide m-' + (s.tipo || 'aviso');
  if (s.cor) el.style.setProperty('--slidecor', s.cor);
  if (s.ajuste) el.style.setProperty('--ajuste', s.ajuste);
  const etiqueta = s.etiqueta ? `<div class="etiqueta">${esc(s.etiqueta)}</div>` : '';
  const chamada = s.chamada ? `<div class="chamada"><span>${esc(s.chamada)}</span><i>→</i></div>` : '';
  // arte decorativa (tema Bem Fazer): cartões flutuando ou coração
  let arte = s.arte || (temaBF() ? (s.tipo === 'campanha' && !s.imagem ? 'cartoes' : s.tipo === 'aviso' ? 'coracao' : 'nenhuma') : 'nenhuma');
  if (!temaBF()) arte = 'nenhuma';
  const arteHTML = arte === 'cartoes' ? htmlCartoes(s) : arte === 'coracao' ? htmlCoracao() : '';
  if (arteHTML) el.classList.add('com-arte', 'arte-' + arte);
  switch (s.tipo) {
    case 'campanha':
      el.innerHTML = `${s.imagem ? `<div class="img" style="overflow:hidden"><div class="m-img-anim" style="width:100%;height:100%;background-size:cover;background-position:center;background-image:url('${esc(s.imagem)}')"></div></div>` : ''}
        <div class="caixa">${etiqueta}<div class="titulo">${fmt(s.titulo)}</div><div class="texto">${fmt(s.texto)}</div>${chamada}</div>${arteHTML}`;
      break;
    case 'noticia':
      el.innerHTML = `${s.imagem ? `<div class="img" ${bg(s.imagem)}></div>` : ''}
        <div>${etiqueta}${s.dataTexto ? `<div class="data">${esc(s.dataTexto)}</div>` : ''}
        <div class="titulo">${fmt(s.titulo)}</div><div class="texto">${fmt(s.texto)}</div></div>`;
      break;
    case 'indicador':
      el.innerHTML = `${etiqueta}<div class="numero">${esc(s.destaque)}</div><div class="titulo">${fmt(s.titulo)}</div><div class="texto">${fmt(s.texto)}</div>`;
      break;
    case 'relogio':
      el.innerHTML = `${temaBF() ? `<div class="relogio-marca">${marcaHTML()}</div>` : ''}<div class="grande relogio-vivo">${$('hora').textContent}</div><div class="dia data-viva">${$('data').textContent}</div>
        ${s.titulo ? `<div class="texto" style="margin-top:4vmin">${fmt(s.titulo)}</div>` : ''}`;
      break;
    case 'clima':
      el.innerHTML = cenaClima() + `<div class="cc">${htmlClima()}</div>`;
      break;
    case 'manchetes': {
      const n = Math.max(1, Math.min(6, parseInt(s.quantidade || (document.body.classList.contains('vertical') ? 5 : 4))));
      const lista = [];
      for (let i = 0; i < Math.min(n, manchetes.length); i++) lista.push(manchetes[(giroManchete + i) % manchetes.length]);
      giroManchete = (giroManchete + n) % Math.max(1, manchetes.length);
      el.innerHTML = `<div class="etiqueta">${esc(s.etiqueta || 'Últimas notícias')}</div><div class="lista-m">${lista.map(m =>
        `<div class="man"><div class="t">${esc(m.titulo)}</div><div class="f">${esc(m.fonte)}${m.quando ? ' • ' + esc(tempoAtras(m.quando)) : ''}</div></div>`).join('')}</div>`;
      break;
    }
    case 'imagem':
      el.innerHTML = `<img class="m-img-anim" src="${esc(s.imagem)}" alt="">`;
      break;
    case 'video':
      el.innerHTML = `<video muted playsinline autoplay preload="auto"></video>`;
      videoDoCache(el.querySelector('video'), s.video);
      break;
    default: // aviso
      el.innerHTML = `<div class="caixa">${etiqueta}<div class="titulo">${fmt(s.titulo)}</div><div class="texto">${fmt(s.texto)}</div>${chamada}</div>${arteHTML}`;
  }
  return el;
}

const CORACAO_SVG = `<img class="cor-img" src="${CORACAO_IMG}" alt="">`;
function marcaHTML(cls = '', cor = 'branca') {
  // logo enviado pelo painel (aba Canais) tem prioridade; senão, o logo oficial embutido
  const src = canal && canal.logo && canal.logoNoM && cor === 'branca' ? canal.logo : (cor === 'azul' ? LOGO_AZUL : LOGO_BRANCA);
  return `<span class="wm ${cls}"><img class="wm-img" src="${esc(src)}" alt="Bem Fazer Card"></span>`;
}
function htmlCartoes(s) {
  const cartao = (cls, nome, mat) => `<div class="cartao ${cls}"><span class="c-ic">${CORACAO_SVG}</span>${marcaHTML('wm-cartao', cls === 'c2' ? 'branca' : 'azul')}
    <div class="c-mat">MATRÍCULA: ${mat}</div><div class="c-nome">${nome}</div></div>`;
  const selo1 = s.selo1 ?? 'Tudo a partir de **R$ 29,90** por mês', selo2 = s.selo2 ?? 'Desconto de **até 80%**';
  return `<div class="arte cartoes">
    ${cartao('c1', 'MARIA SOUZA', '0001-00028-00')}${cartao('c2', 'JOÃO PEREIRA', '0001-00031-00')}${cartao('c3', 'ANA LIMA', '0001-00042-00')}
    <div class="coracao-solto">${CORACAO_SVG}</div>
    ${selo1 ? `<div class="selo s1">${fmt(selo1)}</div>` : ''}${selo2 ? `<div class="selo s2">${fmt(selo2)}</div>` : ''}</div>`;
}
function htmlCoracao() { return `<div class="arte coracao"><div class="halo"></div><div class="coracao-grande">${CORACAO_SVG}</div></div>`; }

function proximo() {
  clearTimeout(timer);
  if (!fila.length) return;
  idx = (idx + 1) % fila.length;
  const s = fila[idx];
  const el = render(s);
  const seg = Math.max(3, parseFloat(s.duracao || canal.duracaoPadrao || 10));
  const tr = escolherTransicao(s);
  el.classList.add('tr-' + tr);
  if (['imagem', 'campanha'].includes(s.tipo) && s.imagem && canal.kenburns !== false) {
    el.classList.add('kb'); if (Math.random() < .5) el.classList.add('kb2');
    el.style.setProperty('--dur', (seg + 1.5) + 's');
  }
  palco.appendChild(el);
  [...palco.children].forEach(c => { if (c !== el && !c.classList.contains('saindo')) {
    c.classList.remove('ativo'); c.classList.add('saindo', 'sai-' + tr);
    setTimeout(() => {
      c.querySelectorAll('video').forEach(v => { if (v.src.startsWith('blob:')) URL.revokeObjectURL(v.src); });
      c.remove(); }, 1300); } });
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('ativo')));

  if (s.tipo === 'video') {
    const v = el.querySelector('video');
    let fim = false;
    const avancar = () => { if (!fim) { fim = true; proximo(); } };
    v.addEventListener('ended', avancar);
    v.addEventListener('error', () => setTimeout(avancar, 1000));
    v.play().catch(() => {});
    timer = setTimeout(avancar, (s.duracao ? seg : 300) * 1000); // trava de segurança
  } else {
    timer = setTimeout(proximo, seg * 1000);
  }
}

/* ---------- Clima (Open-Meteo: grátis, sem cadastro) ---------- */
const WMO = {0:['☀️','Céu limpo'],1:['🌤️','Poucas nuvens'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],45:['🌫️','Neblina'],48:['🌫️','Neblina'],
  51:['🌦️','Garoa fraca'],53:['🌦️','Garoa'],55:['🌦️','Garoa forte'],61:['🌧️','Chuva fraca'],63:['🌧️','Chuva'],65:['🌧️','Chuva forte'],
  66:['🌧️','Chuva'],67:['🌧️','Chuva forte'],80:['🌦️','Pancadas de chuva'],81:['🌧️','Pancadas de chuva'],82:['⛈️','Pancadas fortes'],
  95:['⛈️','Trovoadas'],96:['⛈️','Trovoadas com granizo'],99:['⛈️','Trovoadas com granizo']};
const wmo = (c, dia = 1) => {
  const r = WMO[c] || WMO[Math.floor(c / 10) * 10] || ['🌡️', ''];
  if (dia === 0 && c <= 2) return [c === 0 ? '🌙' : '☁️', r[1]];   // à noite, lua em vez de sol
  return r;
};
function cidade() {
  return { nome: (canal && canal.cidade) || 'Altamira',
    lat: parseFloat((canal && canal.lat) || -3.2033), lon: parseFloat((canal && canal.lon) || -52.2064) };
}
async function atualizarClima() {
  if (!canal) return;
  if (canal.clima === false && !(prog.slides || []).some(s => s.tipo === 'clima')) { mostrarClimaTopo(); return; }
  const c = cidade();
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
      `&current=temperature_2m,weather_code,relative_humidity_2m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=auto&forecast_days=4`, {cache: 'no-store'});
    if (!r.ok) throw 0;
    clima = await r.json(); climaEm = Date.now(); ultimoOnline = Date.now();
  } catch (_) { /* sem internet: o clima some e a fila segue */ }
  mostrarClimaTopo(); montarFila(false);
}
function mostrarClimaTopo() {
  const box = $('climaTopo');
  if (!canal || canal.clima === false || !climaValido()) { box.style.display = 'none'; return; }
  const a = clima.current, [ic, d] = wmo(a.weather_code, a.is_day);
  box.innerHTML = `<span class="ic">${ic}</span><span>${Math.round(a.temperature_2m)}°C<small>${esc(cidade().nome)}</small></span>`;
  box.title = d; box.style.display = 'flex';
}
// Classifica o tempo de cada dia em um tipo de fundo fotográfico
function tipoCeu(code, dia = 1) {
  if (code >= 95 || code === 65 || code === 67 || code === 82) return 'tempestade';   // trovoada ou chuva forte
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 81)) return 'chuva';
  if (code === 45 || code === 48) return 'neblina';
  if (dia === 0) return 'noite';
  if (code === 3) return 'nublado';
  return 'limpo';                                                                    // céu limpo e poucas nuvens
}
const NOME_CEU = {limpo: 'Ensolarado', nublado: 'Nublado', chuva: 'Chuva', tempestade: 'Tempestade', neblina: 'Neblina', noite: 'Noite'};
function fotoCeu(tipo) {
  const f = (prog && prog.fundosClima) || {};
  return f[tipo] || new URL('clima-' + tipo + '.jpg', BASE).href;
}
function aleat(a, b) { return a + Math.random() * (b - a); }
function cenaClima() {
  if (!clima) return '';
  const c = clima.current.weather_code, tipo = tipoCeu(c, clima.current.is_day);
  let h = `<div class="foto" style="background-image:url('${esc(fotoCeu(tipo))}')"></div><div class="veu"></div>`;
  if (tipo === 'chuva' || tipo === 'tempestade') {
    const n = tipo === 'tempestade' ? 110 : 60;
    for (let i = 0; i < n; i++) h += `<div class="gota" style="left:${aleat(-5,105)}%;animation-duration:${aleat(.45,.8).toFixed(2)}s;animation-delay:${-aleat(0,1).toFixed(2)}s"></div>`;
  }
  if (tipo === 'tempestade' && c >= 95) h += '<div class="flash"></div>';
  return `<div class="ceu">${h}</div>`;
}
function htmlClima() {
  if (!clima) return '';
  const a = clima.current, [ic, desc] = wmo(a.weather_code, a.is_day), dd = clima.daily;
  const dias = dd.time.slice(1, 4).map((t, i) => {
    const k = i + 1, [ic2] = wmo(dd.weather_code[k]);
    const nome = new Date(t + 'T12:00:00').toLocaleDateString('pt-BR', {weekday: 'short'}).replace('.', '');
    const tp = tipoCeu(dd.weather_code[k], 1);
    return `<div class="dia" style="background-image:url('${esc(fotoCeu(tp))}')"><b>${nome}</b><div class="ic">${ic2}</div><div class="mm">${Math.round(dd.temperature_2m_max[k])}° / ${Math.round(dd.temperature_2m_min[k])}°</div>
      <div class="cond">${NOME_CEU[tp]}</div><div class="ch">💧 ${dd.precipitation_probability_max[k] ?? 0}%</div></div>`;
  }).join('');
  return `<div class="cidade">${esc(cidade().nome)} • agora</div>
    <div class="agora"><span class="ic">${ic}</span><span class="t">${Math.round(a.temperature_2m)}°</span></div>
    <div class="desc">${desc} • máx ${Math.round(dd.temperature_2m_max[0])}° • mín ${Math.round(dd.temperature_2m_min[0])}° • umidade ${a.relative_humidity_2m}%</div>
    <div class="dias">${dias}</div>`;
}

/* ---------- Manchetes (arquivo noticias-auto.json gerado pelo robô do GitHub) ---------- */
async function atualizarManchetes() {
  if (!canal) return;
  try {
    const r = await fetch(URL_MANCHETES + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok || r.headers.get('x-tvcorp-offline') === '1') throw 0;
    const d = await r.json();
    const fontes = canal.fontesManchetes && canal.fontesManchetes.length ? canal.fontesManchetes : null;
    manchetes = (d.itens || []).filter(m => m.titulo && (!fontes || fontes.includes(m.fonte)));
    // arquivo velho (robô parado há mais de 6h) deixa de ser exibido (ver manchetesValidas)
    manchetesEm = d.gerado ? Math.min(Date.now(), new Date(d.gerado).getTime()) : Date.now();
    ultimoOnline = Date.now();
  } catch (_) { /* sem internet ou robô não configurado */ }
  if (prog) { montarRodape(); montarFila(false); }
}
function tempoAtras(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!isFinite(m) || m < 0) return '';
  if (m < 60) return 'há ' + Math.max(1, m) + ' min';
  if (m < 1440) return 'há ' + Math.round(m / 60) + ' h';
  return new Date(iso).toLocaleDateString('pt-BR');
}

/* ---------- Mídias salvas na TV box (funcionam sem internet) ---------- */
function urlsDeMidia(dados) {
  const u = new Set();
  (dados.slides || []).forEach(s => ['imagem', 'video'].forEach(k => { if (s[k] && !String(s[k]).startsWith('data:')) u.add(new URL(s[k], BASE).href); }));
  (dados.canais || []).forEach(c => { if (c.logo && !c.logo.startsWith('data:')) u.add(new URL(c.logo, BASE).href); });
  if ((dados.slides || []).some(s => s.tipo === 'clima'))
    ['limpo', 'nublado', 'chuva', 'tempestade', 'neblina', 'noite'].forEach(t => {
      const f = (dados.fundosClima || {})[t]; if (!f || !f.startsWith('data:')) u.add(f ? new URL(f, BASE).href : new URL('clima-' + t + '.jpg', BASE).href); });
  return [...u];
}
async function guardarMidias(dados) {
  if (!('caches' in window)) return;
  try {
    const cache = await caches.open('tvcorp-midias');
    for (const url of urlsDeMidia(dados)) {
      if (await cache.match(url)) continue;
      try { const r = await fetch(url, {mode: 'cors'}); if (r.ok) await cache.put(url, r.clone()); }
      catch (_) { try { const r2 = await fetch(url, {mode: 'no-cors'}); await cache.put(url, r2); } catch (__) {} }
    }
  } catch (_) {}
}
async function videoDoCache(v, src) {
  const url = new URL(src, BASE).href;
  try {
    if ('caches' in window) {
      const r = await (await caches.open('tvcorp-midias')).match(url);
      if (r && r.type !== 'opaque') { v.src = URL.createObjectURL(await r.blob()); v.play().catch(() => {}); return; }
    }
  } catch (_) {}
  v.src = url; v.play().catch(() => {});
}
// o service worker guarda o player, a programação e as imagens para abrir mesmo sem internet
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('online', () => { carregar(); atualizarClima(); atualizarManchetes(); });
addEventListener('offline', () => { $('status').classList.add('offline'); montarFila(false); montarRodape(); mostrarClimaTopo(); });

/* ---------- Ciclo ---------- */
if (FONTE === 'previa') {
  // modo pré-visualização: o painel envia os dados por postMessage (funciona até abrindo do computador, sem servidor)
  window.addEventListener('message', e => { if (e.data && e.data.tvcorpPrevia) aplicar(e.data.tvcorpPrevia); });
  parent.postMessage({tvcorpPronto: true}, '*');
} else {
  carregar();
  setInterval(carregar, MIN_ATUALIZA * 60000);
}
setInterval(atualizarClima, 20 * 60000);
setInterval(atualizarManchetes, 15 * 60000);
setInterval(() => { if (prog && canal) { mostrarClimaTopo(); montarRodape(); } }, 60000);
setInterval(() => { if (prog && canal) montarFila(false); }, 60000); // reavalia horários a cada minuto
// recarrega a página 1x por dia (03:30) para liberar memória da TV box
setInterval(() => { const d = new Date(); if (d.getHours() === 3 && d.getMinutes() === 30) location.reload(); }, 60000);
</script>
